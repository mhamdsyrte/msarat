name: Build Masarat (Windows / Linux / Android)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  # ============== وندوز ==============
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r desktop/requirements.txt
      - name: Build with PyInstaller
        working-directory: desktop
        run: pyinstaller masarat.spec --noconfirm
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Masarat-windows
          path: desktop/dist/Masarat/

  # ============== لينكس ==============
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r desktop/requirements.txt
      - name: Build with PyInstaller
        working-directory: desktop
        run: pyinstaller masarat.spec --noconfirm
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Masarat-linux
          path: desktop/dist/Masarat/

  # ============== أندرويد (APK) ==============
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ينسخ كود التطبيق المشترك (app/) داخل مجلد android حتى يقدر
      # buildozer يرفقه بالـ APK (main.py بأندرويد يستورد من app/)
      - name: Prepare android project
        run: cp -r app android/app

      - name: Build APK with buildozer (official image)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/android":/home/user/hostcwd \
            kivy/buildozer bash -c "yes | buildozer android debug"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Masarat-android-apk
          path: android/bin/*.apk

  # ============== إصدار (Release) تلقائي عند وضع تاق v* ==============
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip desktop builds
        run: |
          cd artifacts
          zip -r Masarat-windows.zip Masarat-windows
          zip -r Masarat-linux.zip Masarat-linux
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Masarat-windows.zip
            artifacts/Masarat-linux.zip
            artifacts/Masarat-android-apk/*.apk
