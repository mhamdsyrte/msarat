name: Build Masarat (Windows / Linux / Android)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r desktop/requirements.txt
      - name: Build with PyInstaller
        working-directory: desktop
        run: pyinstaller masarat.spec --noconfirm
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Masarat-windows
          path: desktop/dist/Masarat/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r desktop/requirements.txt
      - name: Build with PyInstaller
        working-directory: desktop
        run: pyinstaller masarat.spec --noconfirm
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Masarat-linux
          path: desktop/dist/Masarat/

  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Prepare android project
        run: cp -r app android/app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ant autoconf automake autopoint ccache cmake g++ gcc git \
            lbzip2 libffi-dev libltdl-dev libtool libssl-dev make \
            openjdk-17-jdk patch pkg-config python3-dev python3-venv \
            unzip wget zip

      - name: Install buildozer & cython
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Build APK with buildozer
        working-directory: android
        run: yes | buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Masarat-android-apk
          path: android/bin/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip desktop builds
        run: |
          cd artifacts
          zip -r Masarat-windows.zip Masarat-windows
          zip -r Masarat-linux.zip Masarat-linux
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Masarat-windows.zip
            artifacts/Masarat-linux.zip
            artifacts/Masarat-android-apk/*.apk
